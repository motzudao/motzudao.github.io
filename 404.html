<style>
  :root {
    --silk: #0c1130; --silk-deep: #080c24; --seam: #232b55; --seam-hi: #363f74;
    --warp: #20284f;
    --gold: #d9a64a; --gold-hi: #f4d58c; --gold-dim: rgba(217, 166, 74, 0.22);
    --cream: #efe7d3; --cream-2: #c4bca9; --cream-3: #8f897c; --cin: #d24b34;

    --mono: "Martian Mono", ui-monospace, "SF Mono", Menlo, monospace;
    color-scheme: dark;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scrollbar-color: var(--seam-hi) var(--silk); -webkit-text-size-adjust: 100%; }
  body {
    background: var(--silk); color: var(--cream-2);
    font-family: var(--sans); font-size: 1.0625rem; line-height: 1.95; letter-spacing: 0.02em;
    -webkit-font-smoothing: antialiased;
  }
  body::before { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none; }
  ::selection { background: var(--gold); color: var(--silk); }
  :focus-visible { outline: 2px solid var(--gold-hi); outline-offset: 3px; border-radius: 2px; }

  body { min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: 2rem 16px; text-align: center; }
  body::before { background: repeating-linear-gradient(90deg, rgba(196, 188, 169, .08) 0 1px, transparent 1px 11px); }
  h1 { font-family: var(--serif); font-weight: 900; color: var(--cream); font-size: clamp(6rem, 22vw, 10rem); line-height: 1; background: var(--silk); padding: 0 .2em; display: block; width: max-content; margin: 0 auto; }
  p { display: block; width: fit-content; max-width: 100%; margin: 1.6rem auto 0; background: var(--silk); padding: .3rem .8rem; line-height: 2; }
  a { color: var(--gold-hi); text-decoration: underline; text-decoration-color: var(--gold-dim); text-underline-offset: .3em; }
  a:hover { text-decoration-color: var(--gold-hi); }
  small { display: block; margin: 1.6rem auto 0; width: max-content; background: var(--silk); padding: .2rem .6rem; font-family: var(--sans); font-size: .72rem; letter-spacing: .12em; color: var(--cream-3); }
